<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Musical</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">

    <!--logo -->
    <div class="titulo">
        <img src="img/logo.png" alt="Logo" id="logo">
        <h1>Biblioteca Musical</h1>
    </div>

    <!-- Botón agregar -->
    <label class="btn-agregar">
        + Agregar música
        <input type="file" id="archivo" accept="audio/*" multiple hidden>
    </label>

    <!-- Lista -->
    <ul id="lista-canciones"></ul>

    <!-- Reproductor -->
    <div class="reproductor">

        <h3 id="cancion-actual">Ninguna canción seleccionada</h3>

        <!-- botones -->
        <div class="controles">
            <button id="play">▶</button>
            <button id="pause">⏸</button>
            <button id="stop">⏹</button>
        </div>

        <!-- Volumen -->
        <div class="volumen">
            <span></span>
            <input type="range" id="volumen" min="0" max="1" step="0.01" value="1">
            <span></span>
        </div>

    </div>

</div>

<!-- Audio oculto -->
<audio id="audio"></audio>

<script src="script.js"></script>
</body>
</html>
